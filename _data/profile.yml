short_bio: >-
  <p> 
    Currently I am a first year M.Sc. student of <a href="http://ai.nju.edu.cn/" target="_blank">School of
    Artificial Intelligence</a> in <a href="http://www.nju.edu.cn/" target="_blank">Nanjing University</a>
    and a member of <a href="http://www.lamda.nju.edu.cn/CH.MainPage.ashx" target="_blank">LAMDA</a> Group, led by professor <a href="https://cs.nju.edu.cn/zhouzh/" target="_blank">Zhi-Hua Zhou.</a> 
    I got my B.Sc. degree in June 2026 from <a href="https://www.njust.edu.cn/" target="_blank">Nanjing University of Science and Technology</a>.
  </p>

  <p>
    My research interests include <b>machine learning</b> and its applications in <b>computer vision</b>, currently focusing on <b>continual learning</b> and <b>multimodal large language models</b>.
  </p>

